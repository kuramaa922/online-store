name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Установка зависимостей
              run: npm ci

            - name: Проверка форматирования
              run: npm run format:check

            - name: Линтер
              run: npm run lint

            - name: Проверка типов
              run: npm run typecheck

            - name: Тесты
              run: npm test

            - name: Сборка
              run: npm run build
